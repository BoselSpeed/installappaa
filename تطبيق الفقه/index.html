<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Two values, chosen by the OS from the saved theme: the light theme paints
      the status bar white with dark text, the dark theme the reverse. Fixed to
      a single value it would stay wrong in one of them.
    -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="تطبيق الفقه — موسوعة كتب التوحيد والعقيدة، تعمل بدون إنترنت" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="تطبيق الفقه" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>تطبيق الفقه</title>
    <script>
      // Apply the saved theme before the first paint.
      //
      // The app's own settings resolve asynchronously, which would show a flash
      // of the light theme on every launch. This reads the same storage the
      // app uses and sets the class the stylesheet keys off, synchronously and
      // before anything is rendered.
      (function () {
        try {
          var uid = localStorage.getItem('userId');
          if (!uid) return;
          var raw = localStorage.getItem('fiqh_settings_' + uid);
          if (!raw) return;
          if (JSON.parse(raw).theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // A blocked or malformed store just means the default theme.
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-f1fcebae.js"></script>
    <link rel="stylesheet" href="/assets/index-ffc3f153.css">
  <link rel="manifest" href="/manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
    
  </body>
</html>
